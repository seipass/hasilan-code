name: Hasilan Code Release

on:
  push:
    tags: ['hasilan-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hasilan-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'seipass/hasilan-code' && startsWith(github.ref, 'refs/tags/hasilan-v')
    uses: ./.github/workflows/hasilan-ci.yml

  desktop-package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PI_OFFLINE: '1'
      PI_NO_LOCAL_LLM: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:hasilan
      - run: npm run build:desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: .artifacts/hasilan-code
      - name: Package the verified Web archive in the desktop application
        shell: pwsh
        run: |
          $archive = (Get-ChildItem .artifacts/hasilan-code/hasilan-code-*.tgz | Select-Object -First 1).FullName
          if (-not $archive) { throw 'Verified Web archive not found' }
          npm run pack:desktop -- --web-package $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the packaged desktop application
        run: npm run smoke:desktop -- --executable ".artifacts/desktop/win-unpacked/Hasilan Code.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hasilan-code-desktop-windows
          path: |
            .artifacts/desktop/Hasilan-Code-*.exe
            .artifacts/desktop/Hasilan-Code-*.exe.blockmap
            .artifacts/desktop/latest.yml
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: [verify, desktop-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: .artifacts/hasilan-code
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-desktop-windows
          path: .artifacts/hasilan-code
      - name: Validate tag, source commit and release checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const release=JSON.parse(readFileSync(".artifacts/hasilan-code/release.json","utf8")); assert.equal(process.env.RELEASE_TAG,`hasilan-v${release.version}`); assert.equal(release.commit,process.env.GITHUB_SHA);'
          cd .artifacts/hasilan-code
          sha256sum --check SHA256SUMS
          sha256sum Hasilan-Code-*.exe Hasilan-Code-*.exe.blockmap latest.yml >> SHA256SUMS
      - name: Publish immutable verified GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .artifacts/hasilan-code/* --verify-tag --title "Hasilan Code ${RELEASE_TAG#hasilan-v}" --notes "Independent Hasilan Code release, including its patched Pi SDK. The same archive passed installed-package checks on Windows, macOS and Linux. See README for installation and SHA256SUMS for artifact checksums."

  npm-publish:
    needs: github-release
    if: vars.HASILAN_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global --ignore-scripts npm@11.17.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: package
      - name: Publish the tested tarball using npm trusted publishing
        working-directory: package
        run: |
          sha256sum --check SHA256SUMS
          node ../scripts/hasilan-publish.mjs . --publish
