name: Hasilan Code Release

on:
  push:
    tags: ['hasilan-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Hasilan release tag to recover
        required: true
        type: string
      verified_run_id:
        description: Release workflow run with successful verification jobs
        required: true
        type: string
      npm_only:
        description: Publish npm from the verified archive after the GitHub release exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: hasilan-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'seipass/hasilan-code' && startsWith(github.ref, 'refs/tags/hasilan-v')
    uses: ./.github/workflows/hasilan-ci.yml

  verify-recovery:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'seipass/hasilan-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Confirm that the tagged commit passed all release verification jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIED_RUN: ${{ inputs.verified_run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^hasilan-v[0-9]+\.[0-9]+\.[0-9]+$ && "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          gh run view "$VERIFIED_RUN" --json headSha,jobs | jq -e --arg sha "$(git rev-parse HEAD)" '.headSha == $sha and ([.jobs[] | select(.name | startswith("verify / "))] | length == 6 and all(.[]; .conclusion == "success"))'

  desktop-package:
    needs: [verify, verify-recovery]
    if: always() && !inputs.npm_only && (needs.verify.result == 'success' || needs.verify-recovery.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PI_OFFLINE: '1'
      PI_NO_LOCAL_LLM: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: .recovery-support
          persist-credentials: false
      - name: Apply the corrected desktop verification script
        if: github.event_name == 'workflow_dispatch'
        run: Copy-Item .recovery-support/apps/desktop/scripts/smoke.mjs apps/desktop/scripts/smoke.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:hasilan
      - run: npm run build:desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: .artifacts/hasilan-code
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Package the verified Web archive in the desktop application
        shell: pwsh
        run: |
          $archive = (Get-ChildItem .artifacts/hasilan-code/hasilan-code-*.tgz | Select-Object -First 1).FullName
          if (-not $archive) { throw 'Verified Web archive not found' }
          npm run pack:desktop -- --web-package $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the packaged desktop application
        run: npm run smoke:desktop -- --executable ".artifacts/desktop/win-unpacked/Hasilan Code.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hasilan-code-desktop-windows
          path: |
            .artifacts/desktop/Hasilan-Code-*.exe
            .artifacts/desktop/Hasilan-Code-*.exe.blockmap
            .artifacts/desktop/latest.yml
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: [verify, verify-recovery, desktop-package]
    if: always() && needs.desktop-package.result == 'success' && (needs.verify.result == 'success' || needs.verify-recovery.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: .artifacts/hasilan-code
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-desktop-windows
          path: .artifacts/hasilan-code
      - name: Validate tag, source commit and release checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const release=JSON.parse(readFileSync(".artifacts/hasilan-code/release.json","utf8")); assert.equal(process.env.RELEASE_TAG,`hasilan-v${release.version}`); assert.equal(release.commit,process.env.RELEASE_COMMIT);'
          cd .artifacts/hasilan-code
          sha256sum --check SHA256SUMS
          sha256sum Hasilan-Code-*.exe Hasilan-Code-*.exe.blockmap latest.yml >> SHA256SUMS
      - name: Publish immutable verified GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .artifacts/hasilan-code/* --verify-tag --title "Hasilan Code ${RELEASE_TAG#hasilan-v}" --notes "Independent Hasilan Code release, including its patched Pi SDK. The same archive passed installed-package checks on Windows, macOS and Linux. See README for installation and SHA256SUMS for artifact checksums."

  npm-publish:
    needs: [github-release, verify-recovery]
    if: always() && vars.HASILAN_NPM_PUBLISH == 'true' && (needs.github-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.npm_only && needs.verify-recovery.result == 'success'))
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global --ignore-scripts npm@11.17.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hasilan-code-package
          path: package
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the public GitHub archive before npm recovery
        if: github.event_name == 'workflow_dispatch' && inputs.npm_only
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tarball=$(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).tarball")
          public_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq -r --arg file "$tarball" '.assets[] | select(.name == $file) | .digest')
          test -n "$public_digest"
          test "$public_digest" = "sha256:$(sha256sum "$tarball" | cut -d' ' -f1)"
      - name: Publish the tested tarball using npm trusted publishing
        working-directory: package
        run: |
          sha256sum --check SHA256SUMS
          node ../scripts/hasilan-publish.mjs . --publish
