<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-REPLACE'; img-src 'self'">
  <title>Hasilan Code</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Yu Gothic UI", system-ui, sans-serif;
      background: #141414;
      color: #f0f0f0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse 380px 260px at 50% 42%, #202430, transparent);
    }
    main { width: min(440px, calc(100% - 48px)); padding-block: 56px; text-align: center }
    img { display: block; width: 56px; height: 56px; margin-inline: auto; border-radius: 14px }
    main > p { margin-top: 16px }
    .status-panel {
      display: grid;
      justify-items: start;
      gap: 12px;
      margin-top: 16px;
      padding: 16px 18px;
      border: 1px solid #35363b;
      border-radius: 12px;
      background: #1c1d21;
      text-align: start;
    }
    [role="status"] { width: 100%; min-width: 0 }
    .status-label { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; font-size: 12px; font-weight: 650 }
    .status-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f4a7a7 }
    p { margin: 0; color: #b9bac2; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere }
    #message { max-height: 30vh; overflow: auto }
    a { color: #f0f0f0; background: #2b2d35; border: 1px solid #434550; border-radius: 7px; padding: 7px 12px; font-size: 13px; text-decoration: none }
    a:hover { background: #353843 }
    a:focus-visible { outline: 2px solid #a9b8ff; outline-offset: 3px }
    [hidden] { display: none }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <p id="loading" role="status">読み込み中…</p>
    <section id="error" class="status-panel" hidden>
      <div role="status">
        <div class="status-label">起動エラー</div>
        <p id="message"></p>
      </div>
      <a href="hasilan-desktop:retry">もう一度起動</a>
    </section>
  </main>
  <script>
const query = new URLSearchParams(location.search);
if (query.get("failed") === "true") {
  document.getElementById("message").textContent = query.get("message") || "起動に失敗しました。";
  document.getElementById("loading").hidden = true;
  document.getElementById("error").hidden = false;
}
  </script>
</body>
</html>
