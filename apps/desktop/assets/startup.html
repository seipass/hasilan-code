<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-REPLACE'; img-src 'self'">
  <title>Hasilan Code</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", "Gen Interface JP", system-ui, sans-serif;
      background: #12161f;
      color: #e6ecf5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 460px 300px at 50% 40%, rgb(107 158 255 / 12%), transparent 72%),
        radial-gradient(ellipse 320px 220px at 50% 45%, #1c2230, transparent);
    }
    main { width: min(440px, calc(100% - 48px)); padding-block: 56px; text-align: center }
    img { display: block; width: 56px; height: 56px; margin-inline: auto; border-radius: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / 35%) }
    main > p { margin-top: 16px }
    .status-panel {
      display: grid;
      justify-items: start;
      gap: 12px;
      margin-top: 16px;
      padding: 16px 18px;
      border: 1px solid rgb(216 228 255 / 12%);
      border-radius: 12px;
      background: #181d29;
      text-align: start;
    }
    [role="status"] { width: 100%; min-width: 0 }
    .status-label { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; font-size: 12px; font-weight: 600 }
    .status-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f5859f }
    p { margin: 0; color: #b4bfd4; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere }
    #message { max-height: 30vh; overflow: auto }
    a { color: #e6ecf5; background: #232b3d; border: 1px solid rgb(216 228 255 / 16%); border-radius: 8px; padding: 7px 14px; font-size: 13px; text-decoration: none }
    a:hover { background: #2d374e }
    a:focus-visible { outline: 2px solid #6b9eff; outline-offset: 3px }
    [hidden] { display: none }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <p id="loading" role="status">読み込み中…</p>
    <section id="error" class="status-panel" hidden>
      <div role="status">
        <div class="status-label">起動エラー</div>
        <p id="message"></p>
      </div>
      <a href="hasilan-desktop:retry">もう一度起動</a>
    </section>
  </main>
  <script>
const query = new URLSearchParams(location.search);
if (query.get("failed") === "true") {
  document.getElementById("message").textContent = query.get("message") || "起動に失敗しました。";
  document.getElementById("loading").hidden = true;
  document.getElementById("error").hidden = false;
}
  </script>
</body>
</html>
